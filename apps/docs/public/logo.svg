<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Forge — TRA compass mark">
  <!-- Travel Resorts of America diamond + compass star, simplified for UI chrome -->
  <path d="M256 12 500 256 256 500 12 256Z" fill="#1F3A78"/>
  <path d="M256 46 466 256 256 466 46 256Z" fill="#EFA33D"/>
  <defs>
    <g id="card">
      <polygon points="256,86 240.7,219 256,256" fill="#FFFFFF"/>
      <polygon points="256,86 271.3,219 256,256" fill="#8F93C6"/>
    </g>
    <g id="diag">
      <polygon points="326.7,185.3 271.3,219 256,256" fill="#FFFFFF"/>
      <polygon points="326.7,185.3 293,240.7 256,256" fill="#6E72A8"/>
    </g>
  </defs>
  <use href="#diag"/>
  <use href="#diag" transform="rotate(90 256 256)"/>
  <use href="#diag" transform="rotate(180 256 256)"/>
  <use href="#diag" transform="rotate(270 256 256)"/>
  <use href="#card"/>
  <use href="#card" transform="rotate(90 256 256)"/>
  <use href="#card" transform="rotate(180 256 256)"/>
  <use href="#card" transform="rotate(270 256 256)"/>
  <circle cx="256" cy="256" r="16" fill="#16294F"/>
</svg>
